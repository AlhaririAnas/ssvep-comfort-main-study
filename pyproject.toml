[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ssvep-comfort-main-study"
version = "0.1.0"
description = "Main study software for comfort-oriented low-amplitude visual SSVEP paradigms."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "numpy",
  "pandas",
  "scipy",
  "matplotlib",
  "Pillow",
  "python-dotenv",
  "websocket-client",
  "python-dispatch",
  "psychopy",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
